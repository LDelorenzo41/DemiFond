<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DemiFond - Tracker d'allure</title>
    <meta name="description" content="Application PWA pour suivre votre allure de course en temps réel" />
    <meta name="theme-color" content="#1e40af" />

    <!-- Manifeste : source de vérité unique (public/manifest.json).
         Ne jamais déclarer un second lien de manifeste : les navigateurs ne lisent
         que le premier et ignorent silencieusement les suivants. La génération
         automatique par vite-plugin-pwa est désactivée pour cette raison
         (manifest: false dans vite.config.js). -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- iOS : Safari ignore le manifeste pour l'icône et le mode plein écran -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "black" (et non "black-translucent") : la barre d'état reste réservée par iOS,
         le contenu ne passe pas dessous. Aucun safe-area à gérer, donc aucune régression. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="DemiFond" />

    <!-- Capture précoce de beforeinstallprompt.
         Chrome peut émettre l'événement avant l'exécution du bundle React, qui
         est un module donc différé — typiquement lors d'une visite répétée, tout
         étant déjà en cache. Sans cette capture, l'événement est perdu pour de
         bon et le bouton « Installer » n'apparaît jamais. Ce script doit rester
         classique (non-module) et inline pour s'exécuter pendant l'analyse du
         document. src/hooks/usePWAInstall.js lit ensuite window.__pwaInstallEvent. -->
    <script>
      window.__pwaInstallEvent = null;
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__pwaInstallEvent = event;
        window.dispatchEvent(new Event('pwa-install-available'));
      });
      window.addEventListener('appinstalled', function () {
        window.__pwaInstallEvent = null;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
